# vana-client neural rendering (DLSS 5 network). Saved changes apply in game within half a second;
# model, scale and reuse_every rebuild the network (a short hitch). GPU time goes to engine.log.

# small (310.9.16, faster) or original (310.8.0, stronger effect, about twice the cost)
model = small
# network size as a fraction of the render size, 0.25..1 (0.5 is about half the cost, softer effect)
scale = 1
# run the network every Nth frame and carry its edit along the motion in between (2 halves the cost)
reuse_every = 2
# 0 standard, 1 natural, 2 cinematic
style = 0
# the network's own controls, 0..2
intensity = 1
local_tone = 1
local_structure = 1
# how much of the network's change is applied, 0..4 (1 = as made)
strength = 1
# share of the network's colour change, 0..1: 0 keeps the game's colours (the network grades them toward grey)
color = 0
# most colour change the network may make, in stops (with color above 0)
chroma_clamp = 1
# 0..1: holds back the network's dimming of saturated colour (dyes, hair, spell effects)
vivid_guard = 1
# brightens what the network sees, undone afterwards; for dark scenes
exposure_ev = 0
