name = "Hotbars"
version = "1.7.0"
description = "Hotbars of multi-line macros with their actions' icons and recasts, loaded by main job and sub job; a macro library with a builder and a palette to drag from."
authors = ["Arusia"]
permissions = ["actions", "ui.native"]

[settings.on]
type = "bool"
default = false
label = "Hotbars"
help = "Shows the hotbars in an edge window and binds their keys. //hb opens the manager."

[settings.hide_stock]
type = "bool"
default = true
label = "Hide Stock Macro Bar"
help = "Hides the game's own macro palette while the hotbars show. Its Ctrl and Alt keys still run macros unless a bar uses them."

[settings.visible]
type = "bool"
default = true
label = "Show Hotbars"
help = "Draw the hotbars on screen. //hb show and //hb hide switch them for this session."

[settings.bars]
type = "int"
default = 3
min = 1
max = 3
step = 1
label = "Bars"
help = "How many bars to show."

[settings.slots]
type = "int"
default = 10
min = 1
max = 12
step = 1
label = "Slots per Bar"

[settings.size]
type = "int"
default = 52
min = 24
max = 80
step = 2
label = "Slot Size"
help = "Width and height of one slot."

[settings.gap]
type = "int"
default = 4
min = 0
max = 16
step = 1
label = "Slot Gap"

[settings.show_keys]
type = "bool"
default = true
label = "Show Key Hints"
help = "Show each slot's hotkey in its corner."
