name = "XIV Focus and Last Target"
version = "1.2.7+perf.2.focus.2"
description = "Focus and last target using the same frame-free target art and colours as XIV Target Bar. //xft toggles it."
authors = ["Nitsu"]
permissions = ["ui.native", "actions"]

[settings.on]
type = "bool"
default = true
label = "XIV Focus and Last Target"

[settings.show_focus]
type = "bool"
default = true
label = "Show Focus Target"
help = "The Focus readout. Set the focus with //xft focus, /focustarget <pN> or the party menu's Focus entry."

[settings.show_last]
type = "bool"
default = true
label = "Show Last Target"
help = "The Last-target readout: the target you had before the current one."

[settings.width]
type = "int"
default = 300
min = 160
max = 600
step = 20
label = "Bar Width"

[commands.xft]
help = "XIV focus/last bars: on/off/status, or 'focus' to set the focus to your current target (one of your party), 'target' to target the focus, and 'last' to target the last target."
args = "[on|off|status|focus|target|last]"
forms = [
  { args = "on", help = "Show the bars." },
  { args = "off", help = "Hide the bars." },
  { args = "status", help = "Report whether the bars are on." },
  { args = "focus", help = "Set the focus target to your current target (a party member)." },
  { args = "target", help = "Target your focus target." },
  { args = "last", help = "Target your last target." },
]

[settings.last_x]
type = "int"
default = 0
min = -1200
max = 1200
step = 4
label = "Last-target X offset"
help = "Owner-native geometry; not a renderer/window stacking workaround."

[settings.scale]
type = "int"
default = 100
min = 50
max = 200
step = 10
label = "Own scale (%)"
help = "Owner-native geometry; not a renderer/window stacking workaround."

[settings.last_y]
type = "int"
default = 0
min = -800
max = 800
step = 4
label = "Last-target Y offset"
help = "Owner-native geometry; not a renderer/window stacking workaround."

[settings.offset_y]
type = "int"
default = 0
min = -800
max = 800
step = 4
label = "Focus Y offset"
help = "Owner-native geometry; not a renderer/window stacking workaround."

[settings.offset_x]
type = "int"
default = 0
min = -1200
max = 1200
step = 4
label = "Focus X offset"
help = "Owner-native geometry; not a renderer/window stacking workaround."
