name = "XIV Target Bar"
version = "1.2.13"
description = "FFXIV-style target HP bar near the top of the screen, with name, distance and what the target is readying or casting. The cast bar is a compact quarter-width strip right-aligned under the weakness icons. Visual fork of Target Bar."
authors = ["Nitsu"]
permissions = ["ui.native", "actions"]

[settings.on]
type = "bool"
default = true
label = "XIV Target Bar"
help = "Shows an FFXIV-style target bar. Drag it to move it."

[settings.width]
type = "int"
default = 420
min = 200
max = 900
step = 20
label = "Bar Width"

[settings.scale]
type = "int"
default = 100
min = 50
max = 200
step = 10
label = "Target Scale"

[settings.status_count]
type = "int"
default = 12
min = 1
max = 32
step = 1
label = "Visible Target Statuses"

[commands.xtb]
help = "XIV target display, status details and preview."
args = "[on|off|details|preview|status]"

[settings.place_x]
type = "int"
default = 0
min = -2400
max = 2400
step = 4
label = "X offset (screen pixels)"
help = "Owner-native geometry; not a renderer/window stacking workaround."

[settings.place_y]
type = "int"
default = 0
min = -1600
max = 1600
step = 4
label = "Y offset (screen pixels)"
help = "Owner-native geometry; not a renderer/window stacking workaround."
