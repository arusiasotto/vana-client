# arm64 APK via release/build-android-apk.sh (NDK 27, cargo-ndk, Gradle). Push and pull_request upload an artifact
# only. workflow_dispatch can set the release tag (versionName) and publish a GitHub prerelease with the APK.
name: Android

on:
  push:
    branches: [android]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag and APK versionName (e.g. android-v1.0.15-rc5)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        type: boolean
        default: true
      publish:
        description: "Create or update a GitHub release with the APK"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "ndk;27.1.12297006" >/dev/null
          echo "ANDROID_HOME=$SDK" >>"$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.1.12297006" >>"$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build the APK
        env:
          GRADLE: gradle
          VANA_ANDROID_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
          KEYSTORE_BASE64: ${{ secrets.VANA_ANDROID_KEYSTORE_BASE64 }}
          VANA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VANA_ANDROID_KEYSTORE_PASSWORD }}
          VANA_ANDROID_KEY_ALIAS: ${{ secrets.VANA_ANDROID_KEY_ALIAS }}
          VANA_ANDROID_KEY_PASSWORD: ${{ secrets.VANA_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            export VANA_ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
            base64 -d <<<"$KEYSTORE_BASE64" >"$VANA_ANDROID_KEYSTORE"
            export VANA_ANDROID_APK_VARIANT=release
          fi
          bash release/build-android-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vana-client-android-aarch64.apk
          path: target/assets/vana-client-android-aarch64.apk
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          apk=target/assets/vana-client-android-aarch64.apk
          ver="${TAG#android-v}"
          title="Android $ver"
          body="$(cat <<EOF
          Built from \`${{ github.sha }}\` on branch \`${{ github.ref_name }}\`.

          - \`vana-client-android-aarch64.apk\`: release-signed sideload APK (when keystore secrets are set).
          EOF
          )"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --repo "${{ github.repository }}" --clobber
            echo "Updated assets on existing release $TAG"
          else
            args=(--repo "${{ github.repository }}" --target "${{ github.ref_name }}" --title "$title" --notes "$body")
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" "${args[@]}" "$apk"
            echo "Published $TAG"
          fi